<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Fijman Link</title>
  <link
    rel="icon"
    type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' fill='%236fcbc0'%3E%3Cpath d='M4.715 6.542a3.5 3.5 0 1 1 4.95 4.95l-1.06 1.06a3.5 3.5 0 0 1-4.95-4.95l.53-.53a.5.5 0 0 1 .707.707l-.53.53a2.5 2.5 0 1 0 3.536 3.536l1.06-1.06a2.5 2.5 0 1 0-3.536-3.536l-.53.53a.5.5 0 0 1-.707-.707z'/%3E%3Cpath d='M6.335 9.458a3.5 3.5 0 0 1 0-4.95l1.06-1.06a3.5 3.5 0 1 1 4.95 4.95l-.53.53a.5.5 0 0 1-.707-.707l.53-.53a2.5 2.5 0 1 0-3.536-3.536l-1.06 1.06a2.5 2.5 0 0 0 3.536 3.536l.53-.53a.5.5 0 0 1 .707.707l-.53.53a3.5 3.5 0 0 1-4.95 0'/%3E%3C/svg%3E"
  >

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
  >

  <style>
    :root {
      --bg: #050707;

      --panel: rgba(18, 25, 26, 0.55);
      --panel-border: rgba(160, 200, 197, 0.14);
      --panel-border-hover: rgba(160, 200, 197, 0.30);

      --text: #e7efee;
      --muted: #93a6a4;

      --accent: #6fcbc0;
      --accent-dim: rgba(111, 203, 192, 0.16);

      --mx: 50%;
      --my: 40%;
    }

    * {
      box-sizing: border-box;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
      }
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    body {
      min-height: 100dvh;

      background: var(--bg);
      color: var(--text);

      font-family: "Inter", sans-serif;

      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }


    /* =========================
       BACKGROUND
       ========================= */

    .bg {
      position: fixed;
      inset: -3%;

      background-image: url("fijman.jpg");
      background-size: cover;
      background-position: 50% 30%;
      background-repeat: no-repeat;

      filter:
        saturate(0.8)
        contrast(1.05)
        brightness(0.55)
        blur(2px);

      transform: scale(1.06);

      z-index: -3;
    }

    .bg::after {
      content: "";

      position: absolute;
      inset: 0;

      background:
        radial-gradient(
          circle at 50% 45%,
          rgba(0, 0, 0, 0.05) 0%,
          rgba(0, 0, 0, 0.30) 55%,
          rgba(0, 0, 0, 0.70) 100%
        ),
        linear-gradient(
          180deg,
          rgba(3, 6, 6, 0.28),
          rgba(3, 6, 6, 0.62)
        );
    }

    /* soft accent glow that drifts behind the scene, tracks the pointer */
    .glow {
      position: fixed;
      inset: 0;

      z-index: -2;
      pointer-events: none;

      background: radial-gradient(
        480px circle at var(--mx) var(--my),
        rgba(111, 203, 192, 0.16),
        transparent 60%
      );

      transition: background 220ms ease-out;
    }

    /*
      Фонарик освещает только фон.
      Карточка и её содержимое находятся выше этого слоя,
      поэтому подсветка не попадает на блок со ссылками.
    */
    .card {
      position: relative;
      z-index: 1;
    }


    /* =========================
       GRAIN
       ========================= */

    .grain {
      position: fixed;
      inset: 0;

      pointer-events: none;
      z-index: 10;

      opacity: 0.035;

      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.5'/%3E%3C/svg%3E");
    }


    /* =========================
       STAGE
       ========================= */

    .stage {
      width: 100%;
      height: 100dvh;
      min-height: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;

      overflow: hidden;
    }


    /* =========================
       CARD
       ========================= */

    .card {
      width: min(100%, 420px);

      padding: 30px 24px 24px;

      border: 1px solid var(--panel-border);
      border-radius: 24px;

      background: rgba(18, 25, 26, 0.88);

      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);

      box-shadow:
        0 24px 80px rgba(0, 0, 0, 0.42),
        inset 0 1px 0 rgba(255, 255, 255, 0.035);

      overflow: hidden;

      opacity: 0;
      animation: card-in 900ms cubic-bezier(0.22, 1, 0.36, 1) 80ms forwards;
    }

    @keyframes card-in {
      from {
        opacity: 0;
        transform: translateY(22px) scale(0.97);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }


    /* =========================
       PROFILE
       ========================= */

    .profile {
      text-align: center;
      margin-bottom: 22px;
    }

    .avatar-wrap {
      position: relative;

      width: 120px;
      height: 120px;

      margin: 0 auto 15px;

      opacity: 0;
      animation: rise-in 700ms cubic-bezier(0.22, 1, 0.36, 1) 260ms forwards;
    }

    .avatar {
      width: 100%;
      height: 100%;

      border-radius: 50%;

      background-image: url("FijmanText.jpg");
      background-size: 100%;
      background-position: center center;
      background-repeat: no-repeat;

      border: 3px solid rgba(111, 203, 192, 0.72);

      box-shadow:
        0 0 0 5px rgba(111, 203, 192, 0.07),
        0 10px 35px rgba(0, 0, 0, 0.35);
    }

    /* a small pair of meshed gears ticking beside the avatar */
    .gears {
      position: absolute;
      right: -8px;
      bottom: -4px;

      width: 42px;
      height: 42px;

      pointer-events: none;
    }

    .gears i {
      position: absolute;

      color: var(--accent);
      filter: drop-shadow(0 3px 8px rgba(0, 0, 0, 0.45));
    }

    .gear-big {
      top: 2px;
      left: 2px;

      font-size: 26px;

      animation: spin 7s linear infinite;
    }

    .gear-small {
      top: -6px;
      left: 22px;

      font-size: 15px;
      color: rgba(111, 203, 192, 0.85);

      animation: spin-rev 4.5s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes spin-rev {
      to { transform: rotate(-360deg); }
    }

    .name {
      margin: 0;

      font-family: "Archivo", sans-serif;

      font-size: 25px;
      font-weight: 600;

      letter-spacing: -0.035em;

      color: var(--text);

      opacity: 0;
      animation: rise-in 700ms cubic-bezier(0.22, 1, 0.36, 1) 380ms forwards;
    }

    @keyframes rise-in {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }


    /* =========================
       LINKS
       ========================= */

    .links {
      display: flex;
      flex-direction: column;

      gap: 8px;
    }

    .link {
      position: relative;

      display: flex;
      align-items: center;

      width: 100%;
      min-height: 54px;

      padding: 8px 13px;

      color: var(--text);
      text-decoration: none;

      border: 1px solid transparent;
      border-radius: 14px;

      background: rgba(255, 255, 255, 0.025);

      overflow: hidden;

      opacity: 0;
      transform: translateY(10px);
      animation: rise-in 600ms cubic-bezier(0.22, 1, 0.36, 1) forwards;

      transition:
        background 160ms ease,
        border-color 160ms ease,
        transform 160ms ease;
    }

    .links .link:nth-child(1) { animation-delay: 460ms; }
    .links .link:nth-child(2) { animation-delay: 520ms; }
    .links .link:nth-child(3) { animation-delay: 580ms; }
    .links .link:nth-child(4) { animation-delay: 640ms; }
    .links .link:nth-child(5) { animation-delay: 700ms; }
    .links .link:nth-child(6) { animation-delay: 760ms; }
    .links .link:nth-child(7) { animation-delay: 820ms; }

    /* quiet shimmer that sweeps a link only when it's hovered */
    .link::before {
      content: "";

      position: absolute;
      top: 0;
      left: -60%;

      width: 40%;
      height: 100%;

      background: linear-gradient(
        100deg,
        transparent,
        rgba(255, 255, 255, 0.07),
        transparent
      );

      transform: skewX(-12deg);
      transition: none;
    }

    .link:hover::before {
      animation: link-shimmer 900ms ease;
    }

    @keyframes link-shimmer {
      from { left: -60%; }
      to { left: 130%; }
    }

    .link:hover {
      background: rgba(255, 255, 255, 0.055);

      border-color: var(--panel-border-hover);

      transform: translateY(-1px);
    }

    .link:active {
      transform: translateY(0);
    }


    /* =========================
       LINK ICON
       ========================= */

    .link-icon {
      width: 34px;
      min-width: 34px;

      display: flex;
      align-items: center;
      justify-content: center;

      color: var(--accent);

      font-size: 18px;
    }

    .link-icon img {
      width: 18px;
      height: 18px;

      display: block;
    }


    /* =========================
       LINK CONTENT
       ========================= */

    .link-content {
      min-width: 0;
      flex: 1;

      display: flex;
      flex-direction: column;
      justify-content: center;

      padding: 0 10px;
    }

    .link-title {
      font-size: 14px;
      font-weight: 500;

      line-height: 1.2;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .link-subtitle {
      font-size: 12px;
      color: var(--muted);

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }


    /* =========================
       LINK ACTION
       ========================= */

    .link-action {
      width: 28px;
      min-width: 28px;

      display: flex;
      align-items: center;
      justify-content: center;

      color: var(--muted);

      font-size: 14px;

      transition: color 160ms ease;
    }

    .link:hover .link-action {
      color: var(--accent);
    }


    /* =========================
       RESPONSIVE
       ========================= */

    @media (max-height: 720px) {

      .stage {
        padding: 12px;
      }

      .card {
        padding: 22px 20px 18px;

        border-radius: 20px;
      }

      .profile {
        margin-bottom: 15px;
      }

      .avatar-wrap {
        width: 90px;
        height: 90px;

        margin-bottom: 10px;
      }

      .name {
        font-size: 22px;
      }

      .links {
        gap: 6px;
      }

      .link {
        min-height: 46px;

        padding: 6px 11px;
      }
    }


    @media (max-height: 580px) {

      .avatar-wrap {
        width: 72px;
        height: 72px;
      }

      .profile {
        margin-bottom: 10px;
      }

      .name {
        font-size: 20px;
      }

      .link {
        min-height: 40px;
      }
    }


    @media (max-width: 460px) {

      .stage {
        padding: 12px;
      }

      .card {
        padding-left: 18px;
        padding-right: 18px;
      }
    }

  </style>
</head>


<body>

  <div class="bg"></div>
  <div class="glow"></div>
  <div class="grain"></div>


  <main class="stage">

    <section class="card" id="card">

      <header class="profile">

        <div class="avatar-wrap">
          <div class="avatar"></div>

          <span class="gears" aria-hidden="true">
            <i class="bi bi-gear-fill gear-big"></i>
            <i class="bi bi-gear-fill gear-small"></i>
          </span>
        </div>

        <h1 class="name">
          Fijman Link's
        </h1>

      </header>


      <nav class="links" aria-label="Социальные сети и ссылки">


        <!-- TELEGRAM -->

        <a
          class="link"
          href="https://t.me/Fijman"
          target="_blank"
          rel="noopener noreferrer"
        >

          <span class="link-icon">
            <i class="bi bi-telegram"></i>
          </span>

          <span class="link-content">
            <span class="link-title">
              Telegram
            </span>
          </span>

          <span class="link-action">
            <i class="bi bi-arrow-up-right"></i>
          </span>

        </a>


        <!-- VK -->

        <a
          class="link"
          href="https://vk.ru/fijman"
          target="_blank"
          rel="noopener noreferrer"
        >

          <span class="link-icon">

            <img
              src="vk.svg"
              alt=""
              aria-hidden="true"
            >

          </span>

          <span class="link-content">
            <span class="link-title">
              VK
            </span>
          </span>

          <span class="link-action">
            <i class="bi bi-arrow-up-right"></i>
          </span>

        </a>


        <!-- DISCORD -->

        <a
          class="link"
          href="#"
          data-copy="@fijman"
        >

          <span class="link-icon">
            <i class="bi bi-discord"></i>
          </span>

          <span class="link-content">

            <span class="link-title">
              Discord
            </span>

            <span
              class="link-subtitle"
              data-copy-status
            >
              @fijman
            </span>

          </span>

          <span class="link-action">
            <i
              class="bi bi-copy"
              data-copy-icon
            ></i>
          </span>

        </a>


        <!-- ARTSTATION -->

        <a
          class="link"
          href="https://www.artstation.com/fijman"
          target="_blank"
          rel="noopener noreferrer"
        >

          <span class="link-icon">
            <i class="bi bi-anthropic"></i>
          </span>

          <span class="link-content">

            <span class="link-title">
              ArtStation
            </span>

          </span>

          <span class="link-action">
            <i class="bi bi-arrow-up-right"></i>
          </span>

        </a>


        <!-- PORTFOLIO -->

        <a
          class="link"
          href="#"
          data-fill="portfolio-link"
        >

          <span class="link-icon">
            <i class="bi bi-briefcase-fill"></i>
          </span>

          <span class="link-content">

            <span class="link-title">
              Портфолио
            </span>

          </span>

          <span class="link-action">
            <i class="bi bi-arrow-up-right"></i>
          </span>

        </a>


        <!-- STEAM -->

        <a
          class="link"
          href="#"
          data-fill="steam-link"
        >

          <span class="link-icon">
            <i class="bi bi-steam"></i>
          </span>

          <span class="link-content">

            <span class="link-title">
              Steam
            </span>

          </span>

          <span class="link-action">
            <i class="bi bi-arrow-up-right"></i>
          </span>

        </a>


        <!-- SPOTIFY -->

        <a
          class="link"
          href="https://open.spotify.com/user/31ymvopjj6i3huish4ygc4b4noae?si=92a816c8a6c446db"
          target="_blank"
          rel="noopener noreferrer"
        >

          <span class="link-icon">
            <i class="bi bi-spotify"></i>
          </span>

          <span class="link-content">

            <span class="link-title">
              Spotify
            </span>

          </span>

          <span class="link-action">
            <i class="bi bi-arrow-up-right"></i>
          </span>

        </a>


      </nav>

    </section>

  </main>


  <script>

    // ---- Discord copy-to-clipboard (unchanged behaviour) ----

    const discordLink = document.querySelector("[data-copy]");

    if (discordLink) {

      const value = discordLink.dataset.copy;

      const status =
        discordLink.querySelector("[data-copy-status]");

      const icon =
        discordLink.querySelector("[data-copy-icon]");


      discordLink.addEventListener("click", async (event) => {

        event.preventDefault();


        try {

          await navigator.clipboard.writeText(value);


          status.textContent = "скопировано";

          icon.classList.remove("bi-copy");
          icon.classList.add("bi-check2");


          setTimeout(() => {

            status.textContent = value;

            icon.classList.remove("bi-check2");
            icon.classList.add("bi-copy");

          }, 1400);


        } catch {

          status.textContent = value;

        }

      });

    }


    // ---- Pointer-reactive flashlight (background only, never touches the card) ----

    const root = document.documentElement;

    const supportsHover = window.matchMedia("(hover: hover)").matches;

    if (supportsHover) {

      let raf = null;

      window.addEventListener("pointermove", (event) => {

        const px = (event.clientX / window.innerWidth) * 100;
        const py = (event.clientY / window.innerHeight) * 100;

        if (raf) cancelAnimationFrame(raf);

        raf = requestAnimationFrame(() => {
          root.style.setProperty("--mx", px + "%");
          root.style.setProperty("--my", py + "%");
        });

      });

    }

  </script>

</body>

</html>
